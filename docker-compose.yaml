version: '3.8'

services:
  backend:
    build: .
    container_name: digantara-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_ENV: production
      DATABASE_URL: sqlite:///database.db  # Change this if using MySQL/PostgreSQL
    volumes:
      - ./logs:/app/logs  # Persist logs outside the container
      - ./migrations:/app/migrations  # Persist migrations
